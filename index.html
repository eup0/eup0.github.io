<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Letters and Words</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0f0e17;--surface:#1a1929;--card:#1e1d30;--card2:#252438;
  --accent:#e94560;--accent2:#f5a623;--accent3:#7c5cbf;
  --text:#f0eeff;--muted:#7a7a9a;--green:#2ecc71;
}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;min-height:100vh;overflow-x:hidden;user-select:none}

.score-badge{background:rgba(245,166,35,.12);border:2px solid rgba(245,166,35,.3);color:var(--accent2);font-size:24px;font-weight:700;padding:8px 16px;border-radius:22px;line-height:1}

.nav-tabs{display:flex;gap:0;border-bottom:1px solid rgba(255,255,255,0.07)}
.nav-tab{flex:1;padding:14px 4px 12px;text-align:center;font-size:30px;font-weight:500;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;transition:all .15s;line-height:1}
.nav-tab.active{color:var(--text);border-bottom-color:var(--accent3)}

.tabs-row{display:flex;align-items:center;gap:10px;padding:12px 12px 0}
.tabs{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;flex:1}
.tabs::-webkit-scrollbar{display:none}
.tab{flex-shrink:0;padding:12px 20px;border-radius:24px;border:1.5px solid rgba(255,255,255,0.08);background:transparent;color:var(--muted);font-size:30px;font-weight:500;cursor:pointer;transition:all .15s;line-height:1}
.tab.active{background:var(--accent3);border-color:var(--accent3);color:#fff}

.prog-row{display:flex;align-items:center;gap:10px;padding:8px 18px 0;font-size:12px;color:var(--muted)}
.prog-bar{flex:1;height:4px;border-radius:2px;background:rgba(255,255,255,0.08);overflow:hidden}
.prog-fill{height:100%;border-radius:2px;background:linear-gradient(90deg,var(--accent3),var(--accent));transition:width .4s ease}

.scene{padding:10px 12px;display:flex;flex-direction:column;align-items:center;gap:0}

.learn-media-row{width:100%;display:flex;align-items:center;gap:10px;margin-bottom:10px}

.img-wrap{
  flex:1;width:100%;height:240px;border-radius:20px;
  background:var(--card);border:1px solid rgba(255,255,255,0.06);
  display:flex;align-items:center;justify-content:center;
  position:relative;overflow:hidden;cursor:pointer;transition:transform .1s
}
.img-wrap:active{transform:scale(0.98)}
.img-bg{position:absolute;inset:0;opacity:.07;font-size:200px;display:flex;align-items:center;justify-content:center;filter:blur(8px);transform:scale(1.2)}
.img-emoji{font-size:120px;line-height:1;position:relative;z-index:1;transition:transform .3s}
.img-emoji.pop{animation:pop .35s ease}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.25)}70%{transform:scale(0.93)}100%{transform:scale(1)}}
.img-hint{position:absolute;bottom:10px;right:12px;font-size:11px;color:rgba(255,255,255,0.25)}
.img-play-ring{position:absolute;inset:0;border-radius:20px;pointer-events:none;border:3px solid var(--accent);opacity:0;transition:opacity .2s}
.img-wrap.playing .img-play-ring{opacity:1;animation:ring .6s ease-out forwards}
@keyframes ring{0%{opacity:.9;transform:scale(1)}100%{opacity:0;transform:scale(1.04)}}

.tiles-row{display:flex;gap:12px;justify-content:center;margin-bottom:14px;flex-wrap:nowrap;width:100%;min-height:160px;align-items:center}
.tile{flex:0 1 100px;width:100px;height:130px;border-radius:14px;background:var(--card2);border:2px solid rgba(255,255,255,0.08);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;gap:3px;transition:transform .1s,background .15s,border-color .15s;position:relative;overflow:hidden}
.tile.flash{transform:scale(0.88);background:var(--accent);border-color:var(--accent)}
.tile.lit{background:#4a1a2a;border-color:#e94560}
.tile.lit .tile-ltr{color:#ff4466}
.tile:hover{border-color:rgba(255,255,255,0.18);background:#2a2940}
.tile-ltr{font-size:48px;font-weight:700;line-height:1}
.tile.correct{background:#1a3a25 !important;border-color:var(--green) !important}
.tile.wrong{animation:shake .3s ease}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}


.learn-nav-section{width:100%;display:flex;align-items:center;gap:10px;margin-bottom:10px}
.img-nav-btn.full-height{width:136px;height:240px;border-radius:14px;border:1.5px solid rgba(255,255,255,0.08);background:var(--surface);color:var(--text);font-size:24px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .15s;flex:0 0 136px}
.img-nav-btn.full-height.nxt{background:rgba(233,69,96,.1);border-color:rgba(233,69,96,.3);color:#ff8099}

.word-audio-row{width:100%;display:flex;align-items:center;gap:10px;margin-bottom:10px}
.word-meta{flex:1;min-width:0}
.word-en{font-size:32px;font-weight:700;letter-spacing:.06em;margin-bottom:2px}
.word-ru{font-size:24px;color:var(--accent2);font-weight:500}

.play-btn{width:auto;min-width:140px;padding:12px 14px;border-radius:12px;background:var(--accent);border:none;color:#fff;font-size:14px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;transition:opacity .15s,transform .1s;white-space:nowrap}
.play-btn:active{transform:scale(0.97);opacity:.85}
.play-btn.playing{opacity:.6;pointer-events:none}

.mode-row{display:flex;gap:8px;width:100%;margin-bottom:12px}
.mode-btn{flex:1;padding:12px;border-radius:12px;border:1.5px solid rgba(255,255,255,0.08);background:transparent;color:var(--muted);font-size:34px;font-weight:500;cursor:pointer;transition:all .15s;line-height:1}
.mode-btn.active{background:rgba(124,92,191,.2);border-color:var(--accent3);color:var(--text)}

.guess-header{text-align:center;margin-bottom:12px}
.guess-emoji-big{font-size:72px;line-height:1;display:block;margin-bottom:6px}
.guess-prompt{font-size:15px;color:var(--muted);min-height:22px}
.guess-options{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%;margin-bottom:10px}
.guess-opt{padding:12px 8px;border-radius:12px;border:1.5px solid rgba(255,255,255,0.08);background:var(--card2);color:var(--text);font-size:15px;font-weight:600;cursor:pointer;text-align:center;transition:all .15s;line-height:1.2}
.guess-opt .go-en{font-size:18px;font-weight:700;display:block;letter-spacing:.04em}
.guess-opt .go-ru{font-size:12px;color:var(--muted);display:block;margin-top:2px}
.guess-opt:hover{border-color:rgba(255,255,255,0.2)}
.guess-opt.correct{background:#1a3a25;border-color:var(--green)}
.guess-opt.correct .go-en,.guess-opt.correct .go-ru{color:var(--green)}
.guess-opt.wrong{background:#3a1a1a;border-color:var(--accent)}
.guess-opt.wrong .go-en{color:var(--accent)}
.guess-result{text-align:center;font-size:54px;font-weight:700;line-height:1;min-height:64px}


.sound-controls{display:flex;justify-content:center;width:100%;margin:0 0 12px}
.sound-play-btn{width:100%;padding:12px 14px;border-radius:12px;background:var(--accent3);border:1.5px solid rgba(255,255,255,0.15);color:#fff;font-size:22px;font-weight:700;cursor:pointer;line-height:1;transition:opacity .15s,transform .1s}
.sound-play-btn:active{transform:scale(0.98);opacity:.85}
.sound-options{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%;margin-bottom:10px;justify-items:stretch}
.sound-opt{padding:16px 12px;border-radius:14px;border:2px solid rgba(255,255,255,0.08);background:var(--card2);color:var(--text);font-size:48px;font-weight:700;cursor:pointer;text-align:center;transition:all .15s;line-height:1;min-height:80px;width:100%;max-width:none;display:flex;align-items:center;justify-content:center}
.sound-opt:hover{border-color:rgba(255,255,255,0.2)}
.sound-opt.correct{background:#1a3a25;border-color:var(--green)}
.sound-opt.correct{color:var(--green)}
.sound-opt.wrong{background:#3a1a1a;border-color:var(--accent)}
.sound-opt.wrong{color:var(--accent)}
.sound-result{text-align:center;font-size:54px;font-weight:700;line-height:1;min-height:64px}
.version-display{position:fixed;bottom:12px;right:18px;font-size:11px;color:rgba(255,255,255,0.35);font-family:monospace;pointer-events:none}
.autoplay-btn{flex-shrink:0;padding:8px 18px;border-radius:22px;border:2px solid #7c5cbf;background:#252438;color:#d0c8ff;font-size:24px;font-weight:700;cursor:pointer;white-space:nowrap;line-height:1}
.autoplay-btn.on{background:#5c2430;border-color:#e94560;color:#ff8099}
.lang-select{flex-shrink:0;height:46px;min-width:84px;border-radius:12px;border:1.5px solid rgba(255,255,255,0.12);background:#252438;color:#f0eeff;padding:0 10px;font-size:24px;font-weight:700;line-height:1}

.review-block{width:100%;max-height:620px;overflow-y:auto;padding-right:4px}
.review-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.review-card{background:var(--card2);border:1.5px solid rgba(255,255,255,0.08);border-radius:12px;padding:8px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;min-height:150px}
.review-thumb{width:72px;height:72px;display:flex;align-items:center;justify-content:center;margin-bottom:6px;font-size:52px;line-height:1}
.review-thumb img{max-width:72px;max-height:72px;object-fit:contain}
.review-en{font-size:14px;font-weight:700;line-height:1.1;letter-spacing:.04em;text-align:center}
.review-ru{font-size:11px;color:var(--muted);line-height:1.2;text-align:center;margin-top:2px}

.nav-row{display:flex;gap:10px;width:100%}
.nav-btn{flex:1;padding:14px;border-radius:12px;border:1.5px solid rgba(255,255,255,0.08);background:var(--surface);color:var(--text);font-size:15px;font-weight:500;cursor:pointer;transition:background .15s}
.nav-btn.nxt{background:rgba(233,69,96,.1);border-color:rgba(233,69,96,.3);color:#ff8099}
.nav-btn:active{opacity:.75}

.streak{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--accent2);min-height:20px;justify-content:center;padding:6px 0}
.status{font-size:12px;color:var(--muted);text-align:center;min-height:18px;padding-bottom:16px}
.status.on{color:var(--accent2)}
.swipe-hint{font-size:11px;color:rgba(255,255,255,0.15);text-align:center;padding:0 0 8px}
.scene-inner{transition:opacity .18s,transform .18s;width:100%;display:flex;flex-direction:column;align-items:center}
.scene-inner.out{opacity:0;transform:translateY(12px)}
#learn-block{width:100%}

/* ===== ALPHABET ===== */
#screen-alpha{display:none;padding:12px 14px 30px}
.alpha-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:8px;margin-bottom:14px}
.alpha-card{border-radius:14px;background:var(--card2);border:2px solid rgba(255,255,255,0.07);padding:10px 6px 8px;text-align:center;cursor:pointer;transition:all .15s}
.alpha-card:active{transform:scale(0.93)}
.alpha-card.active-card{border-color:var(--accent3);background:rgba(124,92,191,.15)}
.alpha-card .ac-ltr{font-size:36px;font-weight:700;line-height:1;display:block}

.alpha-detail{background:var(--card);border-radius:16px;padding:14px;margin-bottom:12px;display:none}
.alpha-detail-ltr{font-size:64px;font-weight:700;text-align:center;line-height:1;margin-bottom:4px}
.alpha-play-btn{width:100%;padding:12px;border-radius:10px;background:var(--accent3);border:none;color:#fff;font-size:15px;font-weight:600;cursor:pointer;transition:opacity .15s}
.alpha-play-btn:active{opacity:.75}

.alpha-words{background:var(--card);border-radius:16px;padding:14px 14px 10px;margin-bottom:10px}
.alpha-words-title{font-size:12px;color:var(--muted);margin-bottom:10px;letter-spacing:.03em}
.alpha-word-list{display:flex;flex-direction:column;gap:8px}

/* chip row */
.alpha-word-chip{display:flex;align-items:center;gap:8px;background:var(--card2);border:1.5px solid rgba(255,255,255,0.07);border-radius:12px;padding:8px 12px;cursor:pointer;transition:all .15s;width:100%}
.alpha-word-chip.expanded{border-color:var(--accent3);background:rgba(124,92,191,.12);border-radius:12px 12px 0 0}
.alpha-word-chip .ch-emoji{font-size:20px;flex-shrink:0}
.alpha-word-chip .ch-word{font-size:15px;font-weight:700}
.alpha-word-chip .ch-ru{font-size:12px;color:var(--muted)}
.alpha-word-chip .ch-hint{margin-left:auto;font-size:11px;color:var(--muted);flex-shrink:0}

/* expand panel */
.alpha-word-expand{display:none;background:var(--surface);border:1.5px solid var(--accent3);border-top:none;border-radius:0 0 12px 12px;padding:12px 10px 10px}
.alpha-word-expand.open{display:block}

/* big emoji inside expand */
.aex-img{width:100%;height:130px;border-radius:12px;background:var(--card);border:1px solid rgba(255,255,255,0.06);display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;margin-bottom:10px;cursor:pointer}
.aex-img-bg{position:absolute;inset:0;opacity:.07;font-size:140px;display:flex;align-items:center;justify-content:center;filter:blur(6px);transform:scale(1.2)}
.aex-img-em{font-size:72px;line-height:1;position:relative;z-index:1}
.aex-img-em.pop{animation:pop .35s ease}

.alpha-exp-tiles{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:8px}
.alpha-exp-tile{flex:1;min-width:52px;max-width:70px;height:72px;border-radius:12px;background:var(--card2);border:2px solid rgba(255,255,255,0.08);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;gap:2px;transition:transform .1s,background .15s,border-color .15s}
.alpha-exp-tile.flash{transform:scale(0.86);background:var(--accent);border-color:var(--accent)}
.alpha-exp-tile .et-ltr{font-size:26px;font-weight:700;line-height:1}
.alpha-exp-play{width:100%;padding:9px;border-radius:9px;background:var(--accent);border:none;color:#fff;font-size:13px;font-weight:600;cursor:pointer;transition:opacity .15s;display:flex;align-items:center;justify-content:center;gap:6px}
.alpha-exp-play:active{opacity:.75}
</style>
</head>
<body>

<div class="nav-tabs">
  <div class="nav-tab active" id="navtab-words" onclick="showScreen('words')">📚</div>
  <div class="nav-tab" id="navtab-alpha" onclick="showScreen('alpha')">🔡</div>
  <div class="nav-tab" id="navtab-sound" onclick="showScreen('sound')">🔊</div>
</div>

<!-- WORDS SCREEN -->
<div id="screen-words">
  <div class="tabs-row">
    <div class="tabs" id="tabs"></div>
    <select id="lang-select" class="lang-select" onchange="setLang(this.value)">
      <option value="ru">🇷🇺</option>
      <option value="fr">🇫🇷</option>
      <option value="es">🇪🇸</option>
      <option value="zh">🇨🇳</option>
      <option value="hi">🇮🇳</option>
      <option value="ar">🇸🇦</option>
    </select>
    <button id="btn-autoplay" class="autoplay-btn" onclick="toggleAutoplay()">▶</button>
    <div class="score-badge" id="score-badge">⭐ 0</div>
  </div>
  <div class="prog-row">
    <div class="prog-bar"><div class="prog-fill" id="prog-fill" style="width:0%"></div></div>
  </div>
  <div class="scene">
  <div class="scene-inner" id="scene-inner">
    <div style="width:100%;display:flex;padding:10px 0 8px">
      <div class="mode-row" style="margin:0;flex:1">
        <button class="mode-btn active" id="btn-learn" onclick="stopAutoplay(); setMode('learn')">📖</button>
        <button class="mode-btn" id="btn-guess" onclick="stopAutoplay(); setMode('guess')">🎯</button>
        <button class="mode-btn" id="btn-review" onclick="stopAutoplay(); setMode('review')">📌</button>
      </div>
    </div>
    <div id="learn-block">
      <div class="learn-nav-section">
        <button class="img-nav-btn full-height" onclick="stopAutoplay(); go(-1)">←</button>
        <div class="img-wrap" id="img-wrap" onclick="stopAutoplay(); onImageClick()">
          <div class="img-bg" id="img-bg"></div>
          <div class="img-emoji" id="img-emoji"></div>
          <div class="img-play-ring"></div>
        </div>
        <button class="img-nav-btn nxt full-height" onclick="stopAutoplay(); go(1)">→</button>
      </div>
      <div class="tiles-row" id="tiles-row"></div>
      <div class="word-audio-row">
        <div class="word-meta">
          <div class="word-en" id="word-en"></div>
          <div class="word-ru" id="word-ru"></div>
        </div>
        <button class="play-btn" id="play-btn" onclick="stopAutoplay(); sayWord()">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
        </button>
      </div>
    </div>
    <div id="guess-block" style="display:none;width:100%">
      <div class="guess-header">
        <span class="guess-emoji-big" id="guess-emoji"></span>
        <div class="guess-prompt" id="guess-prompt">Какое слово?</div>
      </div>
      <div class="guess-options" id="guess-opts"></div>
      <div class="guess-result" id="guess-result"></div>
    </div>
    <div id="review-block" class="review-block">
      <div id="review-grid" class="review-grid"></div>
    </div>
    <div class="streak" id="streak"></div>
    <div class="status" id="status" style="display:none"></div>
    <div class="swipe-hint" id="swipe-hint" style="display:none"></div>
  </div>
  </div>
</div>

<!-- ALPHABET SCREEN -->
<div id="screen-alpha">
  <div class="alpha-grid" id="alpha-grid"></div>
  <div class="alpha-detail" id="alpha-detail">
    <div class="alpha-detail-ltr" id="alpha-det-ltr"></div>
  </div>
  <div class="alpha-words" id="alpha-words-block" style="display:none">
    <div class="alpha-words-title" id="alpha-words-title"></div>
    <div class="alpha-word-list" id="alpha-word-list"></div>
  </div>
</div>

<!-- SOUND GUESS SCREEN -->
<div id="screen-sound" style="display:none;padding:12px 14px 30px">
  <div class="sound-header" style="display:none">
    <div class="sound-prompt" id="sound-prompt"></div>
  </div>
  <div class="sound-controls">
    <button class="sound-play-btn" id="sound-play-btn" onclick="playSoundLetter()">▶</button>
  </div>
  <div class="sound-options" id="sound-opts"></div>
  <div class="sound-result" id="sound-result"></div>
</div>

<script>
var WORDS = {
  "🐾 Животные":[
    {word:"ant", emoji:"🐜",ru:"муравей",en:"ant",es:"hormiga",zh:"蚂蚁",hi:"चींटी",ar:"نملة",fr:"fourmi", ph:["æ","n","t"]},
    {word:"bat", emoji:"🦇",ru:"летучая мышь",en:"bat",es:"murciélago",zh:"蝙蝠",hi:"चमगादड़",ar:"خفاشي",fr:"chauve-souris", ph:["b","æ","t"]},
    {word:"bug", emoji:"🐞",ru:"жук",en:"bug",es:"insecto",zh:"虫",hi:"बग",ar:"حشرة",fr:"insecte", ph:["b","ʌ","g"]},
    {word:"cat", emoji:"🐱",ru:"кошка",en:"cat",es:"gato",zh:"猫",hi:"बिल्ली",ar:"قطة",fr:"chat", ph:["k","æ","t"]},
    {word:"cod", emoji:"🐟",ru:"треска",en:"cod",es:"bacalao",zh:"鳕鱼",hi:"कॉड",ar:"سمك القد",fr:"morue", ph:["k","ɒ","d"]},
    {word:"cow", emoji:"🐄",ru:"корова",en:"cow",es:"vaca",zh:"牛",hi:"गाय",ar:"بقرة",fr:"vache", ph:["k","aʊ"]},
    {word:"crab", emoji:"🦀",ru:"краб",en:"crab",es:"cangrejo",zh:"螃蟹",hi:"केकड़ा",ar:"سرطان البحر",fr:"crabe", ph:["k","r","æ","b"]},
    {word:"crow", emoji:"🐦",ru:"ворона",en:"crow",es:"cuervo",zh:"乌鸦",hi:"कौआ",ar:"غراب",fr:"corbeau", ph:["k","r","əʊ"]},
    {word:"cub", emoji:"🐻",ru:"медвежонок",en:"cub",es:"cachorro",zh:"幼崽",hi:"शावक",ar:"شبل",fr:"petit", ph:["k","ʌ","b"]},
    {word:"dog", emoji:"🐶",ru:"собака",en:"dog",es:"perro",zh:"狗",hi:"कुत्ता",ar:"كلب",fr:"chien", ph:["d","ɒ","g"]},

function isSimpleSpellingWord(item){
  if(item.word.length!==item.ph.length) return false;
  return item.ph.every(function(sound){ return sound.length===1; });
}

  WORDS[cat]=WORDS[cat].filter(isSimpleSpellingWord);
});

function resetAllWords(){

function loadVoices(){ voices = synth.getVoices(); }
if(synth.onvoiceschanged !== undefined) synth.onvoiceschanged = loadVoices;
loadVoices();

function getVoice(){
  return voices.find(function(v){return v.lang==='en-US';})
      || voices.find(function(v){return v.lang.startsWith('en-GB');})
      || voices.find(function(v){return v.lang.startsWith('en');})
      || null;
}

function speak(text, rate, onEnd){
  synth.cancel();
  var v=getVoice();
  if(!v){
    // No TTS voice available - read letter by letter
    playLetterByLetter(text, onEnd);
    return;
  }
  var u = new SpeechSynthesisUtterance(text);
  u.lang='en-US'; u.rate=rate||0.82; u.pitch=1.05;
  if(v) u.voice=v;
  u.onend=onEnd||null;
  synth.speak(u);
}

function playLetterByLetter(text, onEnd){
  var letters = text.split('');
  var i = 0;
  function playNext(){
    if(i > 0) litTile(i-1, false);
    if(i < letters.length){
      litTile(i, true);
      playLetterSnd(letters[i].toLowerCase(), playNext);
      i++;
    } else {
      if(onEnd) onEnd();
    }
  }
  playNext();
}

function playLetterSnd(letter, cb){
  var a = new Audio('snd/'+letter.toLowerCase()+'.mp3');
  a.onended = cb||null;
  a.onerror = function(){ if(cb) cb(); };
  a.play().catch(function(){ if(cb) cb(); });
}

function getActiveWords(){
  return currentCat===ALL_CATEGORY_ID ? allWordsShuffled : WORDS[currentCat];
}

function currentWord(){
  var words=getActiveWords();
  if(!words || words.length===0) return null;
  if(currentIdx>=words.length) currentIdx=0;
  return words[currentIdx];
}

  } else { el.innerHTML=''; }
}

function litTile(idx, on){

  if(tiles[idx]){ tiles[idx].classList.add('flash'); setTimeout(function(){ tiles[idx].classList.remove('flash'); },320); }
  litTile(idx, true);
  setStatus('/'+w.ph[idx]+'/', true);
  playLetterSnd(w.word[idx].toLowerCase(), function(){ litTile(idx, false); setStatus(''); });
}

function flashTiles(word){
  var btn=document.getElementById('play-btn');
  var wrap=document.getElementById('img-wrap');
  if(btn) btn.classList.add('playing');
  if(wrap) wrap.classList.add('playing');
  setStatus(tr('listen'), true);
  var tiles=document.querySelectorAll('#tiles-row .tile');
  var i=0;
  function flashNext(){
    if(i>0&&tiles[i-1]) tiles[i-1].classList.remove('flash');
    if(i<word.length){ if(tiles[i]) tiles[i].classList.add('flash'); i++; setTimeout(flashNext,360); }
    else { setTimeout(function(){ tiles.forEach(function(t){t.classList.remove('flash');}); if(btn) btn.classList.remove('playing'); if(wrap) wrap.classList.remove('playing'); setStatus(''); },320); }
  }
  var em=document.getElementById('img-emoji');
  if(em){ em.classList.remove('pop'); void em.offsetWidth; em.classList.add('pop'); }
  flashNext();
}

function randItems(arr, n, exclude){
  var pool=arr.filter(function(x){ return x!==exclude; });
  var res=[]; var used={};
  while(res.length<n&&pool.length>0){
    var i=randInt(pool.length);
    if(!used[i]){ used[i]=1; res.push(pool[i]); }
  }
  return res;
}

function randInt(max){
  if(max<=0) return 0;
  if(window.crypto && window.crypto.getRandomValues){
    var r = new Uint32Array(1);
    window.crypto.getRandomValues(r);
    return r[0] % max;
  }
  return Math.floor(Math.random()*max);
}

function shuffle(arr){ for(var i=arr.length-1;i>0;i--){ var j=randInt(i+1); var t=arr[i];arr[i]=arr[j];arr[j]=t; } return arr; }

function loadWordImage(word, onLoad, onFail){
  var formats=['png','svg'];
  var i=0;
  function tryNext(){
    if(i>=formats.length){ if(onFail) onFail(); return; }
    var src='img/'+word.toLowerCase()+'.'+formats[i++];
    var img=new Image();
    img.onload=function(){ onLoad(img, src); };
    img.onerror=tryNext;
    img.src=src;
  }
  tryNext();
}

function renderGuess(){
  var w=currentWord();
  if(!w) return;
  guessAnswered=false;
  var guessEmojiEl=document.getElementById('guess-emoji');
  if(guessEmojiEl){
    loadWordImage(w.word,function(_img,src){
      guessEmojiEl.innerHTML='<img src="'+src+'" style="max-width:80px;max-height:80px;object-fit:contain">';
    },function(){
      guessEmojiEl.textContent=w.emoji;
    });
  }
  document.getElementById('guess-prompt').textContent=tr('guessPrompt');
  document.getElementById('guess-result').textContent='';
  var opts=shuffle([w].concat(randItems(ALL_WORDS,3,w)));
  var el=document.getElementById('guess-opts');
  el.innerHTML='';
  opts.forEach(function(opt){
    var langAtRender=currentLang;
    var btn=document.createElement('button');
    btn.className='guess-opt';
    btn.innerHTML='<span class="go-en">'+opt.word.toUpperCase()+'</span><span class="go-ru">'+getWordRuSync(opt)+'</span>';
    var ruEl=btn.querySelector('.go-ru');
    updateWordRuAsync(opt.ru, langAtRender, function(t){
      if(ruEl && document.body.contains(ruEl)) ruEl.textContent=t;
    });
    btn.onclick=function(){
      if(guessAnswered) return;
      guessAnswered=true;
      var ok=(opt===w);
      btn.className='guess-opt '+(ok?'correct':'wrong');
      if(!ok) opts.forEach(function(o,i){ if(o===w) el.children[i].className='guess-opt correct'; });
      var res=document.getElementById('guess-result');
      if(ok){ score+=10; streak++; res.textContent='✅ +10 ⭐'; res.style.color='var(--green)'; updateScore(); updateStreak(); }
      else { streak=0; res.textContent='❌'; res.style.color='var(--accent)'; updateStreak(); }
      speak(w.word,0.8);
      setTimeout(function(){
        if(mode==='guess' && currentWord()===w) go(1);
      }, 900);
    };
    el.appendChild(btn);
  });
}

function setImageForWord(w){
  var emojiEl=document.getElementById('img-emoji');
  var bgEl=document.getElementById('img-bg');

  // Set emoji placeholder immediately and tag elements with current word
  if(emojiEl){ emojiEl.textContent=w.emoji; emojiEl.setAttribute('data-word',w.word); }
  if(bgEl){ bgEl.textContent=w.emoji; bgEl.setAttribute('data-word',w.word); }

  var wword=w.word;
  loadWordImage(wword,function(_img,src){
    // Use dataset check on the element itself — reliable even with async
    var el=document.getElementById('img-emoji');
    var bg=document.getElementById('img-bg');
    if(el && el.getAttribute('data-word')===wword)
      el.innerHTML='<img src="'+src+'" width="100" height="100" style="width:100px;height:100px;object-fit:contain;display:block">';
    if(bg && bg.getAttribute('data-word')===wword)
      bg.innerHTML='<img src="'+src+'" width="180" height="180" style="width:180px;height:180px;object-fit:contain;display:block">';
  },null);
}

    };

    var thumb=document.createElement('div');
    thumb.className='review-thumb';
    thumb.textContent=w.emoji;
    loadWordImage(w.word,function(_img,src){
      thumb.innerHTML='<img src="'+src+'" alt="'+w.word+'">';
    },function(){
      thumb.textContent=w.emoji;
    });

    var en=document.createElement('div');
    en.className='review-en';
    en.textContent=w.word.toUpperCase();

    var ru=document.createElement('div');
    ru.className='review-ru';
    ru.textContent=getWordRuSync(w);
    var langAtRender=currentLang;
    updateWordRuAsync(w.ru, langAtRender, function(t){
      if(ru && document.body.contains(ru)) ru.textContent=t;
    });

    card.appendChild(thumb);
    card.appendChild(en);
    card.appendChild(ru);
    grid.appendChild(card);
  });
}


function render(animate){
  var w=currentWord();
  var words=getActiveWords();
  if(!w || !words || words.length===0) return;
  var inner=document.getElementById('scene-inner');
  function doRender(){
    var langAtRender=currentLang;
    setImageForWord(w);
    document.getElementById('word-en').textContent=w.word.toUpperCase();
    var ruEl=document.getElementById('word-ru');
    ruEl.setAttribute('data-word', w.word);
    ruEl.textContent=getWordRuSync(w);
    updateWordRuAsync(w.ru, langAtRender, function(t){
      var el=document.getElementById('word-ru');
      if(el && el.getAttribute('data-word')===w.word) el.textContent=t;
    });
    var playLabel=document.getElementById('play-label');
    if(playLabel) playLabel.textContent=w.word.toUpperCase();
    var row=document.getElementById('tiles-row');
    row.innerHTML='';
    w.word.split('').forEach(function(ch,i){
      var t=document.createElement('div');
      t.className='tile';
      t.tabIndex=0;
      t.innerHTML='<span class="tile-ltr">'+ch.toUpperCase()+'</span>';
      (function(idx){ t.onclick=function(){ sayLetter(idx); }; })(i);
      (function(idx){
        t.onkeydown=function(e){
          if(e.key==='Enter' || e.key===' '){
            e.preventDefault();
            sayLetter(idx);
          }
        };
      })(i);
      row.appendChild(t);
    });
    var pct=Math.round((currentIdx+1)/words.length*100);
    document.getElementById('prog-fill').style.width=pct+'%';
    document.getElementById('guess-result').textContent='';
    document.getElementById('learn-block').style.display=(mode==='learn'?'':'none');
    document.getElementById('guess-block').style.display=(mode==='guess'?'':'none');
    document.getElementById('review-block').style.display=(mode==='review'?'':'none');
    document.getElementById('streak').style.display=(mode==='review'?'none':'');
    document.getElementById('status').style.display='none';
    document.getElementById('swipe-hint').style.display='none';
    if(mode==='guess'){
      renderGuess();
    }
    if(mode==='review'){
      renderReview();
    }
    inner.classList.remove('out');
  }
  if(animate===false){ doRender(); return; }
  inner.classList.add('out');
  setTimeout(doRender,190);
}

function renderTabs(){
  var el=document.getElementById('tabs');
  el.innerHTML='';

  var allBtn=document.createElement('button');
  allBtn.className='tab'+(currentCat===ALL_CATEGORY_ID?' active':'');
  allBtn.textContent='🌐';
  allBtn.onclick=function(){
    resetAllWords();
    currentCat=ALL_CATEGORY_ID;
    currentIdx=0;
    streak=0;
    updateStreak();
    renderTabs();
    render(true);
  };
  el.appendChild(allBtn);

  cats.forEach(function(cat){
    var btn=document.createElement('button');
    btn.className='tab'+(cat===currentCat?' active':'');
    btn.textContent=(cat.split(' ')[0]||'•');
    (function(c){ btn.onclick=function(){ stopAutoplay(); shuffle(WORDS[c]); currentCat=c; currentIdx=0; streak=0; updateStreak(); renderTabs(); render(true); }; })(cat);
    el.appendChild(btn);
  });
}

function go(dir){
  var words=getActiveWords();
  var nextIdx=currentIdx+dir;
  if(nextIdx>=words.length){
    if(currentCat===ALL_CATEGORY_ID){ resetAllWords(); words=getActiveWords(); }
    else { shuffle(words); }
    currentIdx=0;
  } else if(nextIdx<0){
    if(currentCat===ALL_CATEGORY_ID){ resetAllWords(); words=getActiveWords(); }
    else { shuffle(words); }
    currentIdx=words.length-1;
  } else {
    currentIdx=nextIdx;
  }
  render(true);
}

// ===== ALPHABET =====

function buildAlphaGrid(){
  var grid=document.getElementById('alpha-grid');
  grid.innerHTML='';
  ALPHA.forEach(function(item){
    var card=document.createElement('div');
    card.className='alpha-card';
    card.id='acard-'+item.l;
    card.innerHTML='<span class="ac-ltr">'+item.l+'</span>';
    (function(it){ card.onclick=function(){ selectAlphaLetter(it); }; })(item);
    grid.appendChild(card);
  });
}

function selectAlphaLetter(item){
  if(selectedAlphaLetter){
    var prev=document.getElementById('acard-'+selectedAlphaLetter.l);
    if(prev) prev.classList.remove('active-card');
  }
  selectedAlphaLetter=item;
  var card=document.getElementById('acard-'+item.l);
  if(card) card.classList.add('active-card');

  var det=document.getElementById('alpha-detail');
  det.style.display='block';
  document.getElementById('alpha-det-ltr').textContent=item.l+' '+item.l.toLowerCase();

  playLetterSnd(item.l.toLowerCase(), null);

  var lc=item.l.toLowerCase();
  var found=ALL_WORDS.filter(function(w){ return w.word[0].toLowerCase()===lc; });
  // deduplicate by word
  var seen={};
  found=found.filter(function(w){ if(seen[w.word]) return false; seen[w.word]=1; return true; });

  var wb=document.getElementById('alpha-words-block');
  var wl=document.getElementById('alpha-word-list');
  var wt=document.getElementById('alpha-words-title');
  wl.innerHTML='';

  if(found.length>0){
    wb.style.display='block';
    wt.textContent=tr('alphaWords',{letter:item.l,count:found.length});
    found.forEach(function(w){
      var langAtRender=currentLang;
      var row=document.createElement('div');
      row.style.cssText='display:flex;flex-direction:column';

      var chip=document.createElement('div');
      chip.className='alpha-word-chip';
      chip.innerHTML='<span class="ch-emoji">'+w.emoji+'</span>'
        +'<span class="ch-word">'+w.word.toUpperCase()+'</span>'
        +'<span class="ch-ru">'+getWordRuSync(w)+'</span>'
        +'<span class="ch-hint">▶</span>';
      var chipRuEl=chip.querySelector('.ch-ru');
      updateWordRuAsync(w.ru, langAtRender, function(t){
        if(chipRuEl && document.body.contains(chipRuEl)) chipRuEl.textContent=t;
      });

      var panel=document.createElement('div');
      panel.className='alpha-word-expand';

      // big emoji image block
      var imgBlock=document.createElement('div');
      imgBlock.className='aex-img';
      imgBlock.innerHTML='<div class="aex-img-bg">'+w.emoji+'</div>'
        +'<div class="aex-img-em" id="aex-em-'+w.word+'">'+w.emoji+'</div>';
      imgBlock.onclick=function(e){
        e.stopPropagation();
        speak(w.word,0.8);
        var em=document.getElementById('aex-em-'+w.word);
        if(em){ em.classList.remove('pop'); void em.offsetWidth; em.classList.add('pop'); }
      };

      // letter tiles
      var tilesDiv=document.createElement('div');
      tilesDiv.className='alpha-exp-tiles';
      w.word.split('').forEach(function(ch,idx){
        var t=document.createElement('div');
        t.className='alpha-exp-tile';
        t.innerHTML='<span class="et-ltr">'+ch.toUpperCase()+'</span>';
        t.onclick=function(e){
          e.stopPropagation();
          t.classList.add('flash');
          setTimeout(function(){ t.classList.remove('flash'); },300);
          playLetterSnd(ch.toLowerCase(), null);
        };
        tilesDiv.appendChild(t);
      });

      // play word button
      var playBtn=document.createElement('button');
      playBtn.className='alpha-exp-play';
      playBtn.innerHTML='<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/></svg> '
        +w.word.toUpperCase()+' — '+getWordRuSync(w);
      updateWordRuAsync(w.ru, langAtRender, function(t){
        if(playBtn && document.body.contains(playBtn)){
          playBtn.innerHTML='<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/></svg> '+w.word.toUpperCase()+' — '+t;
        }
      });
      playBtn.onclick=function(e){
        e.stopPropagation();
        speak(w.word,0.8);
      };

      panel.appendChild(imgBlock);
      panel.appendChild(tilesDiv);
      panel.appendChild(playBtn);

      var isOpen=false;
      chip.onclick=function(){
        isOpen=!isOpen;
        panel.className='alpha-word-expand'+(isOpen?' open':'');
        chip.className='alpha-word-chip'+(isOpen?' expanded':'');
        if(isOpen) speak(w.word,0.8);
      };

      row.appendChild(chip);
      row.appendChild(panel);
      wl.appendChild(row);
    });
  } else {
    wb.style.display='block';
    wt.textContent=tr('alphaWordsNone',{letter:item.l});
  }
}

function playSelectedLetter(){
  if(selectedAlphaLetter) playLetterSnd(selectedAlphaLetter.l.toLowerCase(), null);
}

function showScreen(s){
  stopAutoplay();
  document.getElementById('screen-words').style.display=(s==='words'?'block':'none');
  document.getElementById('screen-alpha').style.display=(s==='alpha'?'block':'none');
  document.getElementById('screen-sound').style.display=(s==='sound'?'block':'none');

var soundCurLetter=null;
var soundCurOptions=null;
var soundCurAnswered=false;

function getAlphabetLetters(){
  var letters=[];
  for(var i=0;i<26;i++) letters.push(String.fromCharCode(97+i));
  return letters;
}

function getSoundDistinctLetters(){
  // Исключить пары c и k которые звучат одинаково
  var allLetters=getAlphabetLetters();
  return allLetters.filter(function(l){ return !(l==='c' || l==='k'); });
}

function initSoundGuess(){
  var letters=getSoundDistinctLetters();
  soundCurLetter=letters[randInt(letters.length)];
  var options=randItems(letters, 3, soundCurLetter);
  options.push(soundCurLetter);
  soundCurOptions=shuffle(options);
  soundCurAnswered=false;
  
  document.getElementById('sound-prompt').textContent=tr('soundPick');
  var optsDiv=document.getElementById('sound-opts');
  optsDiv.innerHTML='';
  for(var i=0;i<soundCurOptions.length;i++){
    var opt=document.createElement('div');
    opt.className='sound-opt';
    opt.textContent=soundCurOptions[i].toUpperCase();
    opt.setAttribute('data-idx',i);
    opt.onclick=function(){ checkSoundAnswer(parseInt(this.getAttribute('data-idx'))); };
    optsDiv.appendChild(opt);
  }
  document.getElementById('sound-result').textContent='';
  playLetterSnd(soundCurLetter, null);
}

function playSoundLetter(){
  if(soundCurLetter) playLetterSnd(soundCurLetter, null);
}

function checkSoundAnswer(idx){
  if(soundCurAnswered) return;
  soundCurAnswered=true;
  var correct=(soundCurOptions[idx]===soundCurLetter);
  var opts=document.querySelectorAll('.sound-opt');
  for(var i=0;i<opts.length;i++){
    if(i===idx){
      opts[i].className='sound-opt'+(correct?' correct':' wrong');
    } else if(soundCurOptions[i]===soundCurLetter){
      opts[i].className='sound-opt correct';
    }
  }
  document.getElementById('sound-result').textContent=(correct?'✅':'❌');
  setTimeout(initSoundGuess, 1500);
}

var tX=0;
document.addEventListener('touchstart',function(e){tX=e.touches[0].clientX;},{passive:true});
document.addEventListener('touchend',function(e){
  var dx=e.changedTouches[0].clientX-tX;
  if(Math.abs(dx)>55&&document.getElementById('screen-words').style.display!=='none'&&mode!=='review'){ stopAutoplay(); go(dx<0?1:-1); }
},{passive:true});

document.addEventListener('keydown',function(e){
  if(document.getElementById('screen-words').style.display==='none') return;
  if(mode==='review') return;
  if(e.key==='ArrowRight'||e.key==='ArrowDown'){ stopAutoplay(); go(1); }
  if(e.key==='ArrowLeft'||e.key==='ArrowUp'){ stopAutoplay(); go(-1); }
  if(e.key===' ') sayWord();
});

var autoplayTimer=null;
var autoplayActive=false;
var AUTOPLAY_DELAY=2400;

var VERSION='1.1.0';
var DEFAULT_LANG='ru';
var currentLang=localStorage.getItem('ui_lang')||DEFAULT_LANG;

var I18N={
  ru:{title:'Буквы и слова',guessWhat:'Какое слово?',swipe:'← свайп →',guessPrompt:'Как называется по-английски?',guessOk:'✅ Верно! +10 очков',guessBad:'❌ Нет — это {word}',streak:'Серия: {n}',listen:'Слушай...',soundOk:'✓ Верно!',soundBad:'✗ Неверно. Буква: {letter}'},
  fr:{title:'Lettres et mots',guessWhat:'Quel mot?',swipe:'← glisser →',guessPrompt:'Quel est ce mot en anglais?',guessOk:'✅ Correct! +10 points',guessBad:'❌ Non — c\'est {word}',streak:'Série: {n}',listen:'Écoute...',soundOk:'✓ Correct!',soundBad:'✗ Incorrect. Lettre: {letter}'},
  es:{title:'Letras y Palabras',guessWhat:'¿Que palabra?',swipe:'← desliza →',guessPrompt:'¿Como se llama en ingles?',guessOk:'✅ Correcto! +10 puntos',guessBad:'❌ No — es {word}',streak:'Racha: {n}',listen:'Escuchando...',soundOk:'✓ Correcto!',soundBad:'✗ Incorrecto. Letra: {letter}'},
  zh:{title:'字母与单词',guessWhat:'哪个单词?',swipe:'← 滑动 →',guessPrompt:'这个英文单词是什么?',guessOk:'✅ 正确! +10分',guessBad:'❌ 不对 — 是 {word}',streak:'连击: {n}',listen:'聆听中...',soundOk:'✓ 正确!',soundBad:'✗ 错误。字母: {letter}'},

  ar:{title:'حروف وكلمات',guessWhat:'ما الكلمة؟',swipe:'← اسحب →',guessPrompt:'ما الكلمة بالإنجليزية؟',guessOk:'✅ صحيح! +10 نقاط',guessBad:'❌ لا — هي {word}',streak:'سلسلة: {n}',listen:'جارٍ الاستماع...',soundOk:'✓ صحيح!',soundBad:'✗ خطأ. الحرف: {letter}'}
};

function tr(key, vars){
  var pack=I18N[currentLang]||I18N.ru;
  var txt=pack[key]||I18N.ru[key]||key;
  if(vars){
    Object.keys(vars).forEach(function(k){ txt=txt.replace(new RegExp('\\{'+k+'\\}','g'), String(vars[k])); });
  }
  return txt;
}

function applyLocale(){
  document.title=tr('title');
  var langSel=document.getElementById('lang-select');
  if(langSel) langSel.value=currentLang;
  document.documentElement.lang=currentLang;
  document.documentElement.dir=(currentLang==='ar'?'rtl':'ltr');

  var guessPrompt=document.getElementById('guess-prompt');
  if(guessPrompt) guessPrompt.textContent=tr('guessWhat');
  var swipe=document.getElementById('swipe-hint');
  if(swipe) swipe.textContent=tr('swipe');
}

function setLang(lang){
  if(!I18N[lang]) lang=DEFAULT_LANG;
  currentLang=lang;
  localStorage.setItem('ui_lang', currentLang);
  applyLocale();
  render(false);
}

var DICT_CACHE_KEY='dict_translations_v1';
var dictTranslations={};
var dictPending={};

try{
  var rawCache=localStorage.getItem(DICT_CACHE_KEY);
  if(rawCache) dictTranslations=JSON.parse(rawCache)||{};
}catch(_e){ dictTranslations={}; }

function saveDictTranslations(){
  try{ localStorage.setItem(DICT_CACHE_KEY, JSON.stringify(dictTranslations)); }catch(_e){}
}

function getCachedDictTranslation(src, lang){
  if(lang==='ru') return src;
  if(!dictTranslations[lang]) return '';
  return dictTranslations[lang][src]||'';
}

function setCachedDictTranslation(src, lang, value){
  if(lang==='ru') return;
  if(!dictTranslations[lang]) dictTranslations[lang]={};
  dictTranslations[lang][src]=value;
  saveDictTranslations();
}

function translateRuText(src, lang, cb){
  if(!src){ cb(''); return; }
  if(lang==='ru'){ cb(src); return; }

  var cached=getCachedDictTranslation(src, lang);
  if(cached){ cb(cached); return; }

  var key=lang+'::'+src;
  if(dictPending[key]){ dictPending[key].push(cb); return; }
  dictPending[key]=[cb];

  var url='https://translate.googleapis.com/translate_a/single?client=gtx&sl=ru&tl='+encodeURIComponent(lang)+'&dt=t&q='+encodeURIComponent(src);
  fetch(url)
    .then(function(r){ return r.json(); })
    .then(function(data){
      var translated=src;
      if(data && data[0] && data[0].length){
        translated=data[0].map(function(x){ return x && x[0] ? x[0] : ''; }).join('');
      }
      setCachedDictTranslation(src, lang, translated);
      var waiters=dictPending[key]||[];
      delete dictPending[key];
      waiters.forEach(function(fn){ fn(translated); });
    })
    .catch(function(){
      var waiters=dictPending[key]||[];
      delete dictPending[key];
      waiters.forEach(function(fn){ fn(src); });
    });
}

function getWordRuSync(w){
  if(!w) return '';
  if(currentLang==='ru') return w.ru;
  var cached=getCachedDictTranslation(w.ru, currentLang);
  return cached||w.ru;
}

function updateWordRuAsync(src, lang, applyFn){
  translateRuText(src, lang, function(text){
    if(currentLang!==lang) return;
    applyFn(text);
  });
}

function toggleAutoplay(){
  if(autoplayActive){ stopAutoplay(); }
  else { startAutoplay(); }
}

function startAutoplay(){
  autoplayActive=true;
  var btn=document.getElementById('btn-autoplay');
  if(btn){ btn.textContent='■'; btn.className='autoplay-btn on'; }
  runAutoplayStep();
}

function stopAutoplay(){
  autoplayActive=false;
  clearTimeout(autoplayTimer);
  if(synth) synth.cancel();
  var btn=document.getElementById('btn-autoplay');
  if(btn){ btn.textContent='▶'; btn.className='autoplay-btn'; }
}

document.addEventListener('click', function(e){
  if(!autoplayActive) return;
  if(e && e.target && e.target.id==='btn-autoplay') return;
  stopAutoplay();
});

function runAutoplayStep(){
  if(!autoplayActive) return;
  var w=currentWord();
  if(!w){ stopAutoplay(); return; }
  speak(w.word, 0.78, function(){
    if(!autoplayActive) return;
    autoplayTimer=setTimeout(function(){
      if(!autoplayActive) return;
      go(1);
      autoplayTimer=setTimeout(runAutoplayStep, 400);
    }, 800);
  });
}

buildAlphaGrid();
renderTabs();
render(false);
applyLocale();

// Display version
var vDiv=document.createElement('div');
vDiv.className='version-display';
vDiv.textContent='v'+VERSION;
document.body.appendChild(vDiv);
</script>
